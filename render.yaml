services:
  - type: web
    name: trinet-invoice-ai
    runtime: node
    plan: free
    buildCommand: cd frontend && npm ci --include=dev && npm run build && cd ../backend && npm ci --omit=dev
    startCommand: cd backend && npm start
    healthCheckPath: /api/v1/salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: DB_CA_CERT            # secret file con el certificado de Aiven
        value: /etc/secrets/ca.pem
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: trinet-invoice-ai
      - key: FIREBASE_SERVICE_ACCOUNT  # secret file con la cuenta de servicio
        value: /etc/secrets/firebase-admin.json
      # Configuración web de Firebase: pública por diseño, va en el JavaScript del navegador.
      - key: VITE_FIREBASE_API_KEY
        value: AIzaSyA_aLRBw0nJC12Nh_QFnwDxj4qCvY5pH2Y
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: trinet-invoice-ai.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: trinet-invoice-ai
